# ONE-CLICK DEPLOY (backend + frontend + database together)
# 1. Push this folder to a GitHub repo.
# 2. render.com -> New + -> Blueprint -> pick the repo -> Apply.
# 3. Render creates: a Postgres database, the API, and the website.
# 4. After the first deploy, open the "shyam-timber-web" service -> Environment ->
#    set VITE_API_URL to the API URL Render shows (https://shyam-timber-api.onrender.com)
#    and open "shyam-timber-api" -> Environment -> set CLIENT_URL to the website URL. Redeploy both.
databases:
  - name: shyam-timber-db
    plan: free
    databaseName: shyam_timber
    user: shyam

services:
  - type: web
    name: shyam-timber-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    disk:
      name: uploads
      mountPath: /app/server/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: shyam-timber-db, property: connectionString }
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: OTP_PROVIDER
        value: console          # change to msg91 + add MSG91_AUTH_KEY for real SMS
      - key: UPLOAD_DIR
        value: /app/server/uploads
      - key: PUBLIC_URL
        value: https://shyam-timber-api.onrender.com
      - key: CLIENT_URL
        value: https://shyam-timber-web.onrender.com

  - type: web
    name: shyam-timber-web
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://shyam-timber-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
