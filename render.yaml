# ONE-CLICK DEPLOY on Render's FREE tier (no credit card, no disk).
#
#   render.com -> New + -> Blueprint -> pick this repo -> Apply
#
# Creates: Postgres database + API (Docker) + website (static site).
# Photos you upload are stored INSIDE the database (STORAGE_DRIVER=db),
# because free services do not get a persistent disk.
#
# After the first deploy, if Render gave your services different names, open
#   shyam-timber-web -> Environment -> VITE_API_URL  = your API url
#   shyam-timber-api -> Environment -> CLIENT_URL    = your website url
# and redeploy both.

databases:
  - name: shyam-timber-db
    plan: free
    databaseName: shyam_timber
    user: shyam

services:
  - type: web
    name: shyam-timber-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: shyam-timber-db, property: connectionString }
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: STORAGE_DRIVER
        value: db                 # images live in Postgres - works without a paid disk
      - key: OTP_PROVIDER
        value: console            # switch to msg91 + MSG91_AUTH_KEY for real SMS
      - key: PUBLIC_URL
        value: https://shyam-timber-api.onrender.com
      - key: CLIENT_URL
        value: https://shyam-timber-web.onrender.com

  - type: web
    name: shyam-timber-web
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://shyam-timber-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
